# .github/workflows/build.yml
# Build the PvPGN and aura-bot images from their Dockerfiles.
#
# By default this only BUILDS the images (no registry needed): every push and PR
# compiles both from source to prove they still build. To also PUSH, set the
# repository variable REGISTRY (Settings -> Secrets and variables -> Actions ->
# Variables) to your registry namespace, e.g.:
#   ghcr.io/YOUR_ORG        (GitHub Container Registry)
#   docker.io/YOUR_USER     (Docker Hub)
#   registry.example.com/games
# and provide REGISTRY_USERNAME / REGISTRY_PASSWORD as Actions secrets. When
# REGISTRY is set, images are pushed on pushes to the default branch only.
#
# Nothing here is provider-specific beyond GitHub Actions itself; the two
# `docker build` invocations at the bottom of each job work on any runner.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Registry namespace to tag/push into. Empty = build only, never push.
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  pvpgn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Log in only when a registry AND credentials are configured. Pushes to a
      # PR from a fork have no secrets, so this is skipped there and the build
      # still runs.
      - name: Registry login
        if: env.REGISTRY != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build (and push on main) pvpgn
        uses: docker/build-push-action@v6
        with:
          context: pvpgn/
          pull: true
          push: ${{ env.REGISTRY != '' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY != '' && format('{0}/pvpgn:{1}', env.REGISTRY, github.sha) || 'pvpgn:local' }}
            ${{ env.REGISTRY != '' && format('{0}/pvpgn:latest', env.REGISTRY) || 'pvpgn:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  aura:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Registry login
        if: env.REGISTRY != '' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build (and push on main) aura-bot
        uses: docker/build-push-action@v6
        with:
          context: aura/
          pull: true
          push: ${{ env.REGISTRY != '' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY != '' && format('{0}/aura-bot:{1}', env.REGISTRY, github.sha) || 'aura-bot:local' }}
            ${{ env.REGISTRY != '' && format('{0}/aura-bot:latest', env.REGISTRY) || 'aura-bot:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
