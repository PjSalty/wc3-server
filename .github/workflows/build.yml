# .github/workflows/build.yml
# Build the WC3: The Frozen Throne server images - the PvPGN realm plus the
# native-host relay and map daemons - and publish them to this repo's GitHub
# Container Registry (ghcr.io) on pushes to the default branch.
#
# On pull requests (and forks, which have no package-write token) it only
# BUILDS each image, to prove it still compiles. Nothing here is provider
# specific beyond GitHub Actions + GHCR; the Dockerfiles build on any runner.
#
# A published image is signed (cosign, keyless) and carries build provenance and
# an SBOM as attestations, all bound to the image digest. Verify before you run:
#   cosign verify ghcr.io/<owner>/<image>@<digest> \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/build\.yml@refs/heads/main$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<image>@<digest> --repo <owner>/<repo>
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the job adds only what publishing needs.
permissions:
  contents: read

jobs:
  # Branch protection requires these checks by name, and the name includes the
  # matrix values: renaming the job, an image or a context blocks every merge
  # until the protection rule is updated to match.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write     # push images to GHCR
      id-token: write     # OIDC for keyless signing and attestations
      attestations: write # GitHub attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pvpgn
            context: pvpgn/
          - image: wc3-relay
            context: relay/
          - image: wc3-mapd
            context: mapd/
    env:
      # Publish only from the default branch. A pull request, including one from
      # a fork, builds and stops there.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR image names must be lowercase; the owner can be mixed-case.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          provenance: false # the attestation below is the provenance; avoid the buildkit duplicate
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Generate SBOM (SPDX JSON)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Keyless sign
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
