# .github/workflows/build.yml
# Build the WC3: The Frozen Throne server images - the PvPGN realm plus the
# native-host relay and map daemons - and publish them to this repo's GitHub
# Container Registry (ghcr.io) on pushes to the default branch.
#
# On pull requests (and forks, which have no package-write token) it only
# BUILDS each image, to prove it still compiles. Nothing here is provider
# specific beyond GitHub Actions + GHCR; the Dockerfiles build on any runner.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pvpgn
            context: pvpgn/
          - image: wc3-relay
            context: relay/
          - image: wc3-mapd
            context: mapd/
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; the owner can be mixed-case.
      - name: Resolve registry namespace
        id: ns
        run: echo "ns=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Log in only on a real push to the default branch (PRs from forks have no
      # write token); the built-in GITHUB_TOKEN publishes to this repo's GHCR.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          pull: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.ns.outputs.ns }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ns.outputs.ns }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
